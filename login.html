<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión - Gastos Familiares</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div style="max-width: 380px; margin: 60px auto; padding: 24px; font-family: sans-serif;">
    <h1 style="text-align:center; margin-bottom: 24px;">Gastos Familiares</h1>

    <form id="formLogin">
      <div style="margin-bottom: 12px;">
        <label for="email">Correo</label><br />
        <input type="email" id="email" required style="width:100%; padding:8px;" />
      </div>

      <div style="margin-bottom: 12px;">
        <label for="password">Contraseña</label><br />
        <input type="password" id="password" required minlength="6" style="width:100%; padding:8px;" />
      </div>

      <button type="submit" id="btnIniciarSesion" style="width:100%; padding:10px; margin-bottom:8px;">
        Iniciar sesión
      </button>

      <button type="button" id="btnRegistrar" style="width:100%; padding:10px;">
        Registrarme
      </button>
    </form>

    <p id="mensajeLogin" style="text-align:center; margin-top:16px;"></p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/auth.js"></script>

  <script>
    const formLogin = document.getElementById("formLogin");
    const mensajeLogin = document.getElementById("mensajeLogin");
    const btnRegistrar = document.getElementById("btnRegistrar");

    formLogin.addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      const { error } = await iniciarSesion(email, password);

      if (error) {
        mensajeLogin.textContent = "Error: " + error.message;
        return;
      }

      window.location.href = "index.html";
    });

    btnRegistrar.addEventListener("click", async () => {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if (!email || !password) {
        mensajeLogin.textContent = "Completa correo y contraseña para registrarte.";
        return;
      }

      const { error } = await registrar(email, password);

      if (error) {
        mensajeLogin.textContent = "Error al registrar: " + error.message;
        return;
      }

      mensajeLogin.textContent = "Cuenta creada. Iniciando sesión...";
      const { error: errorLogin } = await iniciarSesion(email, password);

      if (errorLogin) {
        mensajeLogin.textContent = "Cuenta creada, ahora inicia sesión manualmente.";
        return;
      }

      window.location.href = "index.html";
    });
  </script>

</body>
</html>
