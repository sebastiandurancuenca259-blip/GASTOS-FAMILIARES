<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión - Gastos Familiares</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #ecfdf5 0%, #eff6ff 100%);
      padding: 24px;
    }

    .login-card {
      width: 100%;
      max-width: 400px;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(16, 185, 129, 0.12);
      overflow: hidden;
    }

    .login-card__header {
      background: linear-gradient(135deg, #10b981 0%, #3b82f6 100%);
      padding: 32px 28px;
      text-align: center;
    }

    .login-card__logo {
      font-size: 2rem;
      margin-bottom: 6px;
    }

    .login-card__header h1 {
      color: #fff;
      font-size: 1.4rem;
      font-weight: 800;
    }

    .login-card__header p {
      color: rgba(255, 255, 255, 0.85);
      font-size: 0.85rem;
      margin-top: 4px;
    }

    .login-card__body {
      padding: 28px;
    }

    .campo {
      margin-bottom: 18px;
    }

    .campo label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #374151;
      margin-bottom: 6px;
    }

    .campo input {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #e5e7eb;
      border-radius: 10px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .campo input:focus {
      border-color: #10b981;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn--primary {
      background: linear-gradient(135deg, #10b981 0%, #3b82f6 100%);
      color: #fff;
      margin-bottom: 12px;
    }

    .btn--primary:hover {
      opacity: 0.92;
    }

    .btn--secondary {
      background: #f0fdf4;
      color: #059669;
      border: 1.5px solid #d1fae5;
    }

    .btn--secondary:hover {
      background: #ecfdf5;
    }

    #mensajeLogin {
      margin-top: 16px;
      text-align: center;
      font-size: 0.85rem;
      color: #ef4444;
      min-height: 18px;
    }

    #mensajeLogin.exito {
      color: #059669;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="login-card__header">
      <div class="login-card__logo">🏺</div>
      <h1>Gastos Familiares</h1>
      <p>Ingresa a tu cuenta para continuar</p>
    </div>

    <div class="login-card__body">
      <form id="formLogin">
        <div class="campo">
          <label for="email">Correo</label>
          <input type="email" id="email" required />
        </div>

        <div class="campo">
          <label for="password">Contraseña</label>
          <input type="password" id="password" required minlength="6" />
        </div>

        <button type="submit" id="btnIniciarSesion" class="btn btn--primary">
          Iniciar sesión
        </button>

        <button type="button" id="btnRegistrar" class="btn btn--secondary">
          Crear cuenta nueva
        </button>
      </form>

      <p id="mensajeLogin"></p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/auth.js"></script>

  <script>
    const formLogin = document.getElementById("formLogin");
    const mensajeLogin = document.getElementById("mensajeLogin");
    const btnRegistrar = document.getElementById("btnRegistrar");

    formLogin.addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      mensajeLogin.textContent = "";
      mensajeLogin.classList.remove("exito");

      const { error } = await iniciarSesion(email, password);

      if (error) {
        mensajeLogin.textContent = "Error: " + error.message;
        return;
      }

      window.location.href = "index.html";
    });

    btnRegistrar.addEventListener("click", async () => {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      mensajeLogin.textContent = "";
      mensajeLogin.classList.remove("exito");

      if (!email || !password) {
        mensajeLogin.textContent = "Completa correo y contraseña para registrarte.";
        return;
      }

      const { error } = await registrar(email, password);

      if (error) {
        mensajeLogin.textContent = "Error al registrar: " + error.message;
        return;
      }

      mensajeLogin.textContent = "Cuenta creada. Iniciando sesión...";
      mensajeLogin.classList.add("exito");

      const { error: errorLogin } = await iniciarSesion(email, password);

      if (errorLogin) {
        mensajeLogin.textContent = "Cuenta creada, ahora inicia sesión manualmente.";
        mensajeLogin.classList.remove("exito");
        return;
      }

      window.location.href = "index.html";
    });
  </script>

</body>
</html>
